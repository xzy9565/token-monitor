[package]
name = "token-monitor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autobins = false

[dependencies]
token-monitor-core = { path = "../token-monitor-core" }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time", "process"] }
chrono = "0.4"
unicode-width = "0.2"

[[bin]]
name = "token-monitor"
path = "src/bin/token-monitor.rs"
